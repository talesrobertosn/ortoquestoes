<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cápsula: propaganda do Orto Questões</title>
<!-- Estilo "cápsula" (propaganda de 3 segundos): fundo amarelo, "QUESTÕES GRÁTIS" gigante, uma cápsula
     enorme e a faixa preta "Crie sua conta grátis". Feed 1080x1350 (feed) e stories 1080x1920 (story).
     node marketing/instagram/gerar.mjs marketing/instagram/posts/2026-10-10-bula-propaganda/post.html -->
<style>
@font-face { font-family: Jakarta; src: url(../../fontes/plus-jakarta-sans-latin-wght-normal.woff2) format('woff2'); font-weight: 200 800; }
@font-face { font-family: Inter; src: url(../../fontes/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
:root { --amarelo: #ffd43b; --tinta: #111; --verde: #14655E; --vermelho: #e63946; --branco: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #333; }
section { position: relative; overflow: hidden; margin-bottom: 40px; width: 1080px; height: 1350px; color: var(--tinta);
  background: radial-gradient(circle at 80% 45%, #ffe680 0, transparent 45%), var(--amarelo); font-family: Inter, sans-serif; }
section.story { height: 1920px; }
/* raios de fundo, estilo cartaz */
section::before { content: ""; position: absolute; left: 50%; top: 52%; width: 2600px; height: 2600px; transform: translate(-50%,-50%);
  background: repeating-conic-gradient(rgba(255,255,255,.22) 0 6deg, transparent 6deg 15deg); }
section > * { position: absolute; }

.etiqueta { left: 70px; padding: 12px 22px; background: var(--tinta); color: var(--amarelo); font: 900 28px Inter; letter-spacing: .14em; text-transform: uppercase; transform: rotate(-2deg); }
.grande { left: 60px; right: 40px; font: 800 196px/.98 Jakarta; letter-spacing: -.06em; text-transform: uppercase; }
.grande span { display: block; }
.grande .gratis { margin-top: 14px; color: var(--vermelho); font-size: 262px; text-shadow: 10px 10px 0 var(--tinta); -webkit-text-stroke: 4px var(--tinta); }

.capsula { display: flex; width: 860px; height: 250px; border-radius: 999px; overflow: hidden; transform: rotate(-14deg);
  box-shadow: 14px 18px 0 var(--tinta); border: 7px solid var(--tinta); }
.capsula div { flex: 1; display: grid; place-items: center; color: var(--branco); font: 800 58px/1 Jakarta; letter-spacing: -.03em; text-align: center; }
.capsula div:first-child { background: var(--verde); border-right: 7px solid var(--tinta); }
.capsula div:last-child { background: var(--vermelho); }
.capsula::after { content: ""; position: absolute; left: 60px; right: 60px; top: 26px; height: 34px; border-radius: 999px; background: rgba(255,255,255,.35); }

.chips { left: 70px; right: 70px; display: flex; flex-wrap: wrap; gap: 16px; }
.chips span { padding: 14px 26px; border-radius: 999px; border: 5px solid var(--tinta); background: var(--branco); font: 800 34px Jakarta; letter-spacing: -.02em; }

.cta { left: 0; right: 0; bottom: 0; padding: 40px 70px 46px; background: var(--tinta); color: var(--branco); }
.cta b { display: block; font: 800 84px/1 Jakarta; letter-spacing: -.04em; }
.cta b em { font-style: normal; color: var(--amarelo); }
.cta span { display: block; margin-top: 14px; font: 800 44px Inter; color: var(--amarelo); letter-spacing: .01em; }

.pilula { width: 110px; height: 44px; border-radius: 999px; border: 5px solid var(--tinta); background: linear-gradient(90deg, var(--verde) 50%, var(--branco) 50%); }
.marca { right: 70px; display: flex; align-items: center; gap: 12px; font: 30px Jakarta; }
.marca svg { width: 50px; height: 50px; } .marca b { font-weight: 800; }
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sim" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#14655e"/>
<circle cx="17" cy="20" r="4.5" fill="#9cc3bd"/><rect x="26" y="16.5" width="24" height="7" rx="3.5" fill="#9cc3bd"/>
<circle cx="17" cy="32" r="4.5" fill="#f4cf7c"/><rect x="26" y="28.5" width="24" height="7" rx="3.5" fill="#f4cf7c"/>
<circle cx="17" cy="44" r="4.5" fill="#9cc3bd"/><rect x="26" y="40.5" width="19" height="7" rx="3.5" fill="#9cc3bd"/></symbol>
</defs></svg>

<!-- feed -->
<section id="feed">
  <span class="etiqueta" style="top:60px">Prova de ortopedia</span>
  <span class="marca" style="top:58px"><svg><use href="#sim"/></svg><b>Orto</b>Questões</span>
  <h1 class="grande" style="top:160px"><span>Questões</span><span class="gratis">grátis</span></h1>
  <div class="capsula" style="left:110px;top:680px"><div>1 por dia</div><div>até a prova</div></div>
  <span class="pilula" style="left:930px;top:900px;transform:rotate(30deg)"></span>
  <span class="pilula" style="left:40px;top:640px;transform:rotate(-40deg)"></span>
  <div class="chips" style="top:1000px;left:180px"><span>Comentadas</span><span>Simulados</span><span>Ranking</span></div>
  <div class="cta"><b>Crie sua conta <em>grátis</em></b><span>ortoquestoes.com.br</span></div>
</section>

<!-- story -->
<section id="story" class="story">
  <span class="etiqueta" style="top:230px">Prova de ortopedia</span>
  <span class="marca" style="top:226px"><svg><use href="#sim"/></svg><b>Orto</b>Questões</span>
  <h1 class="grande" style="top:350px"><span>Questões</span><span class="gratis" >grátis</span></h1>
  <div class="capsula" style="left:110px;top:960px"><div>1 por dia</div><div>até a prova</div></div>
  <span class="pilula" style="left:920px;top:1240px;transform:rotate(30deg)"></span>
  <span class="pilula" style="left:50px;top:900px;transform:rotate(-40deg)"></span>
  <div class="chips" style="top:1290px;left:190px"><span>Comentadas</span><span>Simulados</span><span>Ranking</span></div>
  <div class="cta" style="bottom:230px;left:40px;right:40px;padding:44px 50px;transform:rotate(-2deg);box-shadow:12px 12px 0 var(--vermelho)"><b style="font-size:90px">Crie sua conta <em>grátis</em></b><span style="font-size:48px">ortoquestoes.com.br</span></div>
</section>
</body></html>
