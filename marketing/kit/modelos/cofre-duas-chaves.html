KIT.montar(EXEMPLO, (q, c) => {

  const cap = c.capa ?? {}, qs = c.questao_slide ?? {}, le = c.leitura ?? {}, rs = c.resposta ?? {}, ps = c.passos ?? {}, fi = c.final ?? {}
  const sec = (n, corpo, rodape) => `<section id="feed-0${n}"${M.dq}><header class="top"><div class="brand"><svg><use href="#sim"/></svg><span><b>Orto</b> Questões</span></div><span class="issue">${t(c.nome_issue ?? 'O cofre')} · ${n}/6</span></header><div class="content">${corpo}</div><footer class="foot"><span>${t(rodape ?? M.rodape)}</span><b>0${n} / 06</b></footer></section>`
  const chaves = cap.chaves ?? ['CHAVE 1', 'CHAVE 2']
  const painel = (p, i) => `<div class="panel"${i ? ' style="margin-top:24px"' : ''}><div class="row" style="align-items:center;gap:20px"><span class="pill">0${i + 1}</span><h3>${t(p.titulo)}</h3></div><p class="gap">${t(p.texto)}</p></div>`
  return [
    sec(1, `<div class="tag">${t(cap.tag ?? M.tagPadrao)}</div><h1>${t(cap.titulo)}</h1><p class="gap">${t(cap.sub)}</p><div class="vault" style="height:605px;margin-top:34px"><div class="vaultinner"><div class="safe-photo"><img src="${M.img}"/></div><div class="door"><span class="micro">${t(cap.porta ?? 'DUPLA IDENTIFICAÇÃO')}</span><div class="dial"><i class="mark"></i><span class="dialnum">01</span></div><span class="label">${t(chaves[0])}</span><div class="dial"><i class="mark"></i><span class="dialnum">02</span></div><span class="label">${t(chaves[1])}</span></div></div><span class="bolts"></span></div>${M.fonte}`, cap.rodape ?? 'Arraste para abrir'),
    sec(2, `<div class="tag">${t(qs.tag ?? 'O desafio · duas chaves, uma resposta')}</div><h2>${t(qs.titulo ?? 'Qual combinação [[abre?]]')}</h2><div class="row" style="margin-top:35px"><div style="width:360px;flex:none"><div class="photo" style="height:720px"><img src="${M.img}" alt="Imagem original da questão"/></div>${M.fonte}</div><div class="col"><p class="enunciado" style="font-size:32px;color:#fff;margin-bottom:27px">${M.enunciado}</p>${M.opcoes()}</div></div><div class="cream" style="margin-top:29px"><h3 style="font-size:31px">${t(qs.pedido_titulo ?? 'Escolha A, B, C ou D.')}</h3><p style="font-size:28px;margin-top:9px">${t(qs.pedido_texto ?? 'Comente a sua letra antes de continuar.')}</p></div>`),
    sec(3, `<div class="tag">${t(le.tag ?? 'Leitura da imagem')}</div><h2>${t(le.titulo)}</h2><div class="row" style="margin-top:43px;gap:36px"><div style="width:380px"><div class="photo" style="height:635px"><img src="${M.img}" alt="Imagem original da questão"/></div>${M.fonte}</div><div class="col">${(le.paineis ?? []).map(painel).join('')}</div></div>${le.nota ? `<div class="cream" style="margin-top:32px"><h3 style="font-size:31px">${t(le.nota.titulo)}</h3><p style="font-size:28px;margin-top:9px">${t(le.nota.texto)}</p></div>` : ''}`),
    sec(4, `<div class="tag">${t(rs.tag ?? `Combinação correta · alternativa ${q.gabarito}`)}</div><h1 style="font-size:${rs.tamanho ?? 75}px">${t(rs.titulo)}</h1><p class="gap">${t(rs.sub)}</p><div class="row" style="margin:29px 0">${(rs.chaves ?? []).map((k, i) => `<div class="panel col"><span class="micro">CHAVE 0${i + 1}</span><h3 style="margin-top:12px">${t(k)}</h3></div>`).join('')}</div>${M.comparacao(rs.comparacao, 'margin-top:30px')}${rs.guardar ? `<div class="cream" style="margin-top:25px"><span class="micro" style="color:#14655e">${t(rs.guardar_rotulo ?? 'PARA GUARDAR')}</span><h3 style="font-size:31px;margin-top:10px">${t(rs.guardar)}</h3></div>` : ''}`),
    sec(5, `<div class="tag">${t(ps.tag ?? 'Para a prova')}</div><h2>${t(ps.titulo)}</h2>${ps.sub ? `<p class="gap">${t(ps.sub)}</p>` : ''}${M.passos(ps.itens, 'margin-top:35px')}${ps.destaque ? `<div class="cream" style="margin-top:26px"><span class="micro" style="color:#14655e">${t(ps.destaque.rotulo)}</span><h3 style="font-size:32px;margin-top:9px">${t(ps.destaque.titulo)}</h3>${ps.destaque.texto ? `<p style="font-size:27px;margin-top:9px">${t(ps.destaque.texto)}</p>` : ''}</div>` : ''}${ps.nota ? `<p class="note" style="margin-top:24px">${t(ps.nota)}</p>` : ''}`),
    sec(6, `<div class="tag">${t(fi.tag ?? 'O que vem depois da resposta')}</div><h2>${t(fi.titulo ?? 'O gabarito abre a porta.\n[[O comentário explica.]]')}</h2><div class="row" style="margin-top:40px;gap:48px;align-items:center"><div style="width:440px;flex:none">${M.celular(fi.celular)}</div><div class="features">${M.recursos(fi.recursos)}<p class="note">${t(fi.nota ?? 'Tela ilustrativa com trechos do comentário desta questão.')}</p></div></div><div class="cta" style="position:absolute;top:1030px;width:940px"><h3>${t(fi.cta_titulo ?? 'Questão grátis todo dia.')}</h3><p>${t(fi.cta_texto ?? 'Crie sua conta. O limite gratuito se renova diariamente.')}</p></div>`, 'ortoquestoes.com.br'),
  ].join('')
}, () => AJUSTAR_COFRE_MECANICA(1255))
</script>
