    sec(3, `<div class="tag">${t(ra.tag ?? 'Raciocínio · ajuste de precisão')}</div><h1 style="font-size:${ra.tamanho ?? 80}px">${t(ra.titulo)}</h1><p class="gap">${t(ra.sub)}</p>${relogio(ra.altura_imagem ?? 400)}${M.passos(ra.passos, 'margin-top:25px')}`),
    sec(4, `<div class="tag">${t(rs.tag ?? `Alternativa ${q.gabarito}`)}</div><h1 style="font-size:${rs.tamanho ?? 77}px">${t(rs.titulo)}</h1>${rs.destaque ? `<div class="cream" style="margin-top:30px"><h3 style="font-size:35px">${t(rs.destaque.titulo)}</h3><p style="font-size:30px;margin-top:14px">${t(rs.destaque.texto)}</p></div>` : ''}${rs.mostrador ? `<div class="row" style="margin:28px 0;align-items:center;gap:28px"><div class="dial" style="width:150px;height:150px;flex:none"><span class="dialnum" style="font-size:26px">${t(rs.mostrador)}</span></div><p style="font-size:29px">${t(rs.mostrador_texto)}</p></div>` : ''}${M.comparacao(rs.comparacao)}${rs.guardar ? `<p style="font-size:25px;margin-top:25px">${t(rs.guardar)}</p>` : ''}`),
    sec(5, `<div class="tag">${t(ps.tag ?? 'Para a prova')}</div><h1 style="font-size:${ps.tamanho ?? 81}px">${t(ps.titulo)}</h1>${M.passos(ps.itens, 'margin-top:36px')}${ps.destaque ? `<div class="cream" style="margin-top:27px"><h3 style="font-size:32px">${t(ps.destaque.titulo)}</h3><p style="font-size:28px;margin-top:12px">${t(ps.destaque.texto)}</p></div>` : ''}${ps.nota ? `<p class="note" style="margin-top:20px">${t(ps.nota)}</p>` : ''}`),
    sec(6, `<div class="tag">${t(fi.tag ?? M.tagPadrao)}</div><h1 style="font-size:${fi.tamanho ?? 85}px">${t(fi.titulo ?? 'Acerte a letra.\n[[Entenda a\nengrenagem.]]')}</h1><div class="row" style="margin-top:35px;gap:48px;align-items:center"><div style="width:440px;flex:none">${M.celular(fi.celular, (l) => `POR QUE NÃO ${l}?`)}</div><div class="features">${M.recursos(fi.recursos)}</div></div><p class="note" style="margin-top:23px">${t(fi.nota ?? 'Tela ilustrativa com trechos adaptados do comentário.')}</p><div class="cta" style="margin-top:22px"><h3>${t(fi.cta_titulo ?? 'Questão grátis todo dia.')}</h3><p>${t(fi.cta_texto ?? 'Crie sua conta. Acesso gratuito com limite diário renovado.')}</p></div>`, 'ortoquestoes.com.br'),
  ].join('')
}, () => AJUSTAR_COFRE_MECANICA(1630))
