<title>Torneio de Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Versão 2 (12/10/2026), inspirada nas referências do Tales (docs/flashcards/REFERENCIAS.md):
   cenário em pixel art ao fundo (canvas); por cima, um tabuleiro emoldurado com linha central.
   Batalha: adversário em cima, flashcard da pergunta no centro, você embaixo com a vida e os
   poderes, alternativas na mão em leque e botão redondo à direita. Visual único, escuro. */
:root {
  --noite: #0d0b10;
  --pergaminho: #f1e2bf;
  --tinta: #2b1d14;
  --ouro: #e3b04b;
  --ouro-escuro: #8a6420;
  --brasa: #d9542c;
  --musgo: #5fae6a;
  --nevoa: #c9bda6;
  --raro: #4f8fd6; --epico: #9a64d6; --comum: #8d8273;
  --f-titulo: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-texto: "Alegreya", Georgia, "Times New Roman", serif;
  --f-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  /* tampo do tabuleiro; muda com o cenário */
  --tampo: repeating-linear-gradient(0deg, rgba(0,0,0,.38) 0 2px, transparent 2px 58px),
           repeating-linear-gradient(90deg, rgba(255,235,200,.035) 0 1px, transparent 1px 7px),
           linear-gradient(90deg, #4e2f1d, #62402a 28%, #553521 55%, #66432b 80%, #4e2f1d);
  color-scheme: dark;
}
body[data-cena="masmorra"] {
  --tampo: repeating-linear-gradient(0deg, rgba(0,0,0,.45) 0 2px, transparent 2px 64px),
           repeating-linear-gradient(90deg, rgba(0,0,0,.4) 0 2px, transparent 2px 104px),
           radial-gradient(120% 90% at 50% 50%, #5d616b, #3d4048);
}
body[data-cena="campo"] {
  --tampo: radial-gradient(4px 3px at 20% 30%, rgba(255,255,255,.08), transparent),
           repeating-linear-gradient(115deg, rgba(0,0,0,.08) 0 3px, transparent 3px 11px),
           radial-gradient(110% 90% at 50% 50%, #5c8a3e, #3f6a2c 70%, #31531f);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--noite); color: var(--pergaminho); font-family: var(--f-texto); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--ouro); outline-offset: 3px; }

.app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-inline: 16px; padding-block: 10px 12px; gap: 8px; max-width: 1100px; margin: 0 auto; }
#cena { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
.app > * { position: relative; z-index: 1; }

/* Topo */
.topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.marca { font: 800 clamp(17px, 4.4vw, 24px)/1 var(--f-titulo); letter-spacing: .04em; color: var(--ouro); text-shadow: 0 2px 0 #000, 0 0 18px rgba(227,176,75,.35); margin-right: auto; }
.marca small { display: block; font: 500 11px var(--f-pixel); letter-spacing: .14em; color: var(--nevoa); text-shadow: none; margin-top: 4px; text-transform: uppercase; }
.abas { display: flex; background: rgba(0,0,0,.5); border: 2px solid #4a3424; border-radius: 10px; padding: 3px; }
.abas button { border: 0; background: none; padding: 7px 12px; border-radius: 7px; font: 700 13px var(--f-pixel); letter-spacing: .06em; color: var(--nevoa); }
.abas button[aria-pressed="true"] { background: linear-gradient(#6b4a2c, #4a3120); color: #fff3d6; box-shadow: inset 0 -2px 0 rgba(0,0,0,.4); }
.opcoes { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 2px solid #4a3424; background: rgba(0,0,0,.5); border-radius: 999px; padding: 5px 10px; font: 500 12px var(--f-pixel); color: var(--nevoa); }
.chip[aria-pressed="true"] { border-color: var(--ouro); color: #fff3d6; }

/* Tabuleiro emoldurado, com cantos de ouro e linha central */
.tabuleiro { position: relative; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 6px; padding: 10px 12px 12px; border-radius: 18px; background: var(--tampo);
  box-shadow: 0 0 0 2px #000, 0 0 0 5px #b8913f, 0 0 0 6px #fff0b8, 0 0 0 8px #6b4a1c, 0 0 0 10px #000, 0 22px 50px rgba(0,0,0,.65), inset 0 0 50px rgba(0,0,0,.55); margin: 10px; min-height: 0; }
.canto { position: absolute; width: 18px; height: 18px; transform: rotate(45deg); background: linear-gradient(135deg, #fff0b8, #d4a64a 45%, #7a5520); border: 2px solid #000; z-index: 2; }
.canto.c1 { left: -19px; top: -19px; } .canto.c2 { right: -19px; top: -19px; } .canto.c3 { left: -19px; bottom: -19px; } .canto.c4 { right: -19px; bottom: -19px; }

/* Adversário (Batalha) */
.inimigo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.retrato { position: relative; flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #5a3a52, #24131f 70%); box-shadow: 0 0 0 2px #000, 0 0 0 5px #c9a14a, 0 0 0 7px #000, 0 6px 14px rgba(0,0,0,.6); }
.retrato canvas { width: 70%; height: 70%; image-rendering: pixelated; }
.ret-heroi { background: radial-gradient(circle at 50% 40%, #3e5a86, #142035 70%); }
.retrato.chefe { box-shadow: 0 0 0 2px #000, 0 0 0 5px #ffd76a, 0 0 0 7px #000, 0 0 22px rgba(255,200,80,.6); }
.placa { flex: 1; min-width: 0; display: grid; gap: 4px; }
.placa strong { font: 800 clamp(12px, 3.4vw, 15px)/1.1 var(--f-titulo); letter-spacing: .04em; color: #fff3d6; text-shadow: 0 2px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.placa strong em { font: 700 10px var(--f-pixel); font-style: normal; letter-spacing: .1em; color: #1b130b; background: var(--ouro); border-radius: 4px; padding: 2px 5px; margin-left: 6px; vertical-align: 2px; }
.barra { position: relative; height: 15px; background: #1b1215; border: 2px solid #000; box-shadow: 0 0 0 2px #5a3b2a; border-radius: 3px; overflow: hidden; }
.barra i { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(#ef6b4d, #b8321c); transition: width .45s steps(12); }
.barra.inim i { background: linear-gradient(#b48cf0, #6a3fb0); }
.barra b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px var(--f-pixel); color: #fff; text-shadow: 0 1px 0 #000; font-variant-numeric: tabular-nums; }
.placar { display: grid; gap: 4px; justify-items: end; }
.selo-hud { font: 700 12px var(--f-pixel); padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.55); border: 2px solid #4a3424; color: #fff3d6; white-space: nowrap; font-variant-numeric: tabular-nums; }
.selo-hud.ouro { border-color: var(--ouro); color: var(--ouro); }

/* HUD do Estudo */
.hud { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; min-height: 26px; font-family: var(--f-pixel); }
.contador { display: flex; align-items: center; gap: 8px; font: 700 13px var(--f-pixel); color: #fff3d6; background: rgba(0,0,0,.5); border-radius: 8px; padding: 4px 10px; }
.contador .pips { display: flex; gap: 3px; }
.contador .pips i { width: 9px; height: 13px; background: #3a2a20; border: 1px solid #000; }
.contador .pips i.usado { background: var(--ouro); }

/* Mesa: baralho, flashcard, descarte; a linha central passa por trás */
.mesa { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr) minmax(0, 1fr); align-items: center; justify-items: center; gap: 10px; min-height: 0; }
.mesa::before { content: ""; position: absolute; left: -12px; right: -12px; top: 50%; height: 4px; transform: translateY(-50%); background: linear-gradient(90deg, transparent, #000 4%, #c9a14a 8%, #fff0b8 50%, #c9a14a 92%, #000 96%, transparent); box-shadow: 0 0 0 1px rgba(0,0,0,.6); opacity: .85; }
.mesa::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%) rotate(45deg); background: radial-gradient(circle at 35% 35%, #bfe4ff, #3a7fd0 60%, #163a6a); border: 2px solid #000; box-shadow: 0 0 0 2px #c9a14a, 0 0 14px #5fb0ff; }
.slot-palco { position: relative; z-index: 1; width: 100%; height: 100%; min-height: 0; container-type: size; display: grid; place-items: center; }
.pilha { position: relative; z-index: 1; width: clamp(54px, 11vw, 100px); aspect-ratio: 63/88; justify-self: end; }
.pilha.descarte { justify-self: start; }
.pilha .costas { position: absolute; inset: 0; border-radius: 10px; }
.pilha .costas:nth-child(2) { transform: translate(3px, -3px); }
.pilha .costas:nth-child(3) { transform: translate(6px, -6px); }
.pilha span { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); font: 700 12px var(--f-pixel); color: #fff3d6; background: #1d140e; border: 2px solid #c9a14a; border-radius: 999px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.costas { background:
    radial-gradient(circle at 50% 50%, #e3b04b 0 12%, transparent 13%),
    radial-gradient(circle at 50% 50%, #7a2a1c 0 19%, transparent 20%),
    repeating-linear-gradient(45deg, #3b2216 0 6px, #4a2c1c 6px 12px);
  border: 3px solid #1a0f0a; box-shadow: inset 0 0 0 3px #a57b3a, 0 6px 14px rgba(0,0,0,.5); }
.pilha.descarte .costas { opacity: .6; filter: grayscale(.4); }

.palco { position: relative; width: min(340px, 100cqw, calc(100cqh * 63 / 88)); aspect-ratio: 63/88; perspective: 1400px; touch-action: none; transition: width .35s ease; }
body.batalha .palco { touch-action: pan-y; }
.carta { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.75,.25,1.15); cursor: pointer; }
.carta.virada { transform: rotateY(180deg); }
.carta.entra { animation: comprar .55s cubic-bezier(.2,.8,.25,1.1) both; }
.carta.lancada { animation: lancar .5s cubic-bezier(.2,.8,.25,1.1) both; }
@keyframes comprar { from { transform: translate(-90%, 8%) rotate(-14deg) scale(.55); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lancar { from { transform: translateY(-75%) rotate(10deg) scale(.45); opacity: 0; } to { transform: none; opacity: 1; } }
.carta.virada.sai-direita { transition: transform .38s ease-in, opacity .38s; transform: rotateY(180deg) translate(-130%, -6%) rotate(-18deg); opacity: 0; }
.carta.virada.sai-esquerda { transition: transform .38s ease-in, opacity .38s; transform: rotateY(180deg) translate(130%, -6%) rotate(18deg); opacity: 0; }
.carta.virada.sai-cima { transition: transform .38s ease-in, opacity .38s; transform: rotateY(180deg) translateY(-120%) rotate(-4deg); opacity: 0; }

.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; padding: 8px; display: flex;
  background: linear-gradient(145deg, color-mix(in srgb, var(--cor) 92%, #fff), var(--cor) 40%, color-mix(in srgb, var(--cor) 55%, #000));
  box-shadow: 0 0 0 2px #000, 0 14px 30px rgba(0,0,0,.6), 0 0 26px color-mix(in srgb, var(--cor) 45%, transparent); }
.face.verso { transform: rotateY(180deg); }
.moldura { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: 9px; overflow: hidden; color: var(--tinta);
  background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.35), transparent 60%), radial-gradient(90% 60% at 80% 100%, rgba(120,80,30,.18), transparent 70%), linear-gradient(#f4e7c6, #e6d2a4);
  box-shadow: inset 0 0 0 2px rgba(60,35,15,.55), inset 0 0 18px rgba(90,55,20,.35); }
.r-lendaria { --cor: var(--ouro); } .r-epica { --cor: var(--epico); } .r-rara { --cor: var(--raro); } .r-comum { --cor: var(--comum); }
.r-lendaria .face::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 45%, transparent 60%); background-size: 260% 100%; animation: brilho 3.2s ease-in-out infinite; mix-blend-mode: overlay; }
@keyframes brilho { from { background-position: 130% 0; } to { background-position: -130% 0; } }
/* Gema de dano no canto (Batalha): quanto custa errar */
.gema-dano { display: none; position: absolute; left: -9px; top: -9px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; place-items: center; font: 700 14px var(--f-pixel); color: #fff; text-shadow: 0 1px 0 #000;
  background: radial-gradient(circle at 35% 30%, #ff9a7a, #c2361d 55%, #6e140a); box-shadow: 0 0 0 2px #000, 0 0 0 4px #e3b04b, 0 0 0 6px #000, 0 4px 8px rgba(0,0,0,.5); }
body.batalha .gema-dano { display: grid; }

.cabeca { display: flex; align-items: center; gap: 7px; padding: 6px 8px 5px; background: linear-gradient(#3b2416, #2a190f); color: #f6e6c2; }
.brasao { width: 22px; height: 26px; flex: none; image-rendering: pixelated; }
body.batalha .cabeca { padding-left: 26px; }
.cabeca strong { font: 800 clamp(9.5px, 2.6vw, 12.5px)/1.1 var(--f-titulo); letter-spacing: .05em; text-transform: uppercase; min-width: 0; display: block; }
.cabeca em { display: block; font: 500 10px var(--f-pixel); font-style: normal; letter-spacing: .08em; color: #d8bf8a; margin-top: 2px; }
.raridade { margin-left: auto; font: 700 9px var(--f-pixel); letter-spacing: .1em; padding: 3px 6px; border-radius: 4px; color: #1b130b; background: var(--cor); white-space: nowrap; }
.corpo { flex: 1; display: flex; flex-direction: column; gap: 7px; padding: 9px 11px; min-height: 0; overflow: hidden; }
.verso .corpo { overflow-y: auto; scrollbar-width: thin; }
.tipo { font: 700 10px var(--f-pixel); letter-spacing: .12em; text-transform: uppercase; color: #7a5a35; }
.pergunta { font: 600 clamp(13px, 3.7vw, 18px)/1.3 var(--f-texto); text-wrap: balance; }
.lacuna { display: inline-block; min-width: 3.2em; border-bottom: 2px dashed #7a5a35; color: transparent; }
.janela { flex: 1; min-height: 40px; border-radius: 6px; background: #1b1410 center/contain no-repeat; box-shadow: inset 0 0 0 2px #6b4a2c; }
.resposta { font: 800 clamp(15px, 4.3vw, 21px)/1.2 var(--f-texto); color: #3a1f0d; text-wrap: balance; }
.explica { font: 400 clamp(12.5px, 3.3vw, 15px)/1.38 var(--f-texto); }
.explica b { color: #7a2a1c; }
.pe { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 10px 7px; border-top: 1px solid rgba(90,55,20,.3); font: 500 10px var(--f-pixel); color: #6d5233; }
.estrelas { letter-spacing: 2px; color: var(--cor); text-shadow: 0 1px 0 #000; }
.origem { display: flex; gap: 6px; flex-wrap: wrap; }
.origem button { border: 2px solid #6b4a2c; background: #2f1d12; color: #f6e6c2; border-radius: 6px; padding: 5px 8px; font: 700 11px var(--f-pixel); }

/* Lacrada (limite grátis) */
.lacrada .moldura { filter: grayscale(.6) brightness(.8); }
.cera { position: absolute; left: 50%; top: 44%; width: 92px; height: 92px; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 35% 30%, #d4533b, #8f1f12 60%, #5c120a); box-shadow: 0 6px 14px rgba(0,0,0,.55), inset 0 -4px 8px rgba(0,0,0,.4); font: 800 22px var(--f-titulo); color: #f7cfa0; }

/* Controles */
.controles { display: grid; gap: 6px; justify-items: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.dica { font: 500 12px var(--f-pixel); color: var(--nevoa); text-align: center; min-height: 15px; text-shadow: 0 1px 0 #000; }
.botoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 560px; }
.btn { flex: 1 1 0; min-width: 0; border: 3px solid #000; border-radius: 10px; padding: 11px 8px 9px; font: 700 14px var(--f-pixel); letter-spacing: .04em; color: #fff7e6; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), 0 3px 0 #000; transition: transform .08s; text-shadow: 0 1px 0 #000; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.35), 0 1px 0 #000; }
.btn small { display: block; font: 500 10px var(--f-pixel); opacity: .75; margin-top: 2px; }
.b-errei { background: linear-gradient(#c8492b, #8f2d18); }
.b-hesitei { background: linear-gradient(#b98a2c, #7d5a17); }
.b-sabia { background: linear-gradient(#4d9a5a, #2c6735); }
.b-virar { background: linear-gradient(#6b4a2c, #432c1b); }
.btn-largo { width: 100%; }

/* Barra do herói (Batalha): retrato, vida, encaixes de poder, baralho e botão redondo */
.barra-heroi { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 640px; }
.heroi { position: relative; flex: none; }
.gema-vida { position: absolute; right: -14px; bottom: -8px; width: 40px; height: 36px; display: grid; place-items: center; }
.gema-vida canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; filter: drop-shadow(0 2px 0 #000); }
.gema-vida b { position: relative; font: 700 13px var(--f-pixel); color: #fff; text-shadow: 0 1px 0 #000, 0 0 3px #000; margin-top: -3px; font-variant-numeric: tabular-nums; }
.gema-vida.baixa { animation: pulsar .8s ease-in-out infinite; }
@keyframes pulsar { 50% { transform: scale(1.15); } }
.encaixes { display: flex; gap: 6px; margin-left: 14px; }
.encaixe { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2a2230, #0f0b12); box-shadow: 0 0 0 2px #000, 0 0 0 4px #7a5a2a, inset 0 2px 6px rgba(0,0,0,.8); }
.encaixe canvas { width: 22px; height: 22px; image-rendering: pixelated; }
.encaixe.ativo { box-shadow: 0 0 0 2px #000, 0 0 0 4px #c9a14a, 0 0 12px rgba(150,120,255,.7), inset 0 2px 6px rgba(0,0,0,.6); }
.encaixe sup { position: absolute; right: -4px; top: -6px; font: 700 10px var(--f-pixel); background: #1d140e; border: 2px solid #c9a14a; border-radius: 999px; padding: 0 4px; color: #fff3d6; }
.baralho-mini { position: relative; margin-left: auto; width: 34px; height: 46px; }
.baralho-mini .costas { position: absolute; inset: 0; border-radius: 6px; border-width: 2px; }
.baralho-mini b { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font: 700 11px var(--f-pixel); background: #1d140e; border: 2px solid #c9a14a; border-radius: 999px; padding: 0 6px; color: #fff3d6; font-variant-numeric: tabular-nums; }
.redondo { flex: none; width: 76px; height: 76px; border-radius: 50%; border: 3px solid #000; font: 700 14px var(--f-pixel); letter-spacing: .04em; color: #fff7e6; text-shadow: 0 2px 0 #000;
  background: radial-gradient(circle at 40% 32%, #8a7a66, #4a3e33 60%, #2a221c); box-shadow: 0 0 0 3px #c9a14a, 0 0 0 5px #000, 0 6px 14px rgba(0,0,0,.6), inset 0 -5px 0 rgba(0,0,0,.35); transition: transform .1s, filter .2s; }
.redondo:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
.redondo.pronto { background: radial-gradient(circle at 40% 32%, #8ff0a6, #2f9a4c 58%, #155a28); animation: chamar 1.4s ease-in-out infinite; }
.redondo.seguir { background: radial-gradient(circle at 40% 32%, #ffe7a0, #d39a2c 58%, #7a4f10); animation: chamar 1.4s ease-in-out infinite; }
.redondo:active:not(:disabled) { transform: scale(.94); }
@keyframes chamar { 50% { box-shadow: 0 0 0 3px #c9a14a, 0 0 0 5px #000, 0 0 26px 6px rgba(255,230,140,.55), inset 0 -5px 0 rgba(0,0,0,.35); } }

/* Mão em leque: as alternativas */
.mao { position: relative; display: flex; justify-content: center; align-items: flex-end; width: 100%; height: calc(clamp(84px, 21vw, 124px) * 1.4 + 6px); transition: opacity .3s, transform .35s; }
.mao.recolhe { opacity: 0; transform: translateY(40%); pointer-events: none; }
.slot-mao { position: relative; margin-inline: -5px; transform: rotate(var(--r)) translateY(var(--y)); transform-origin: 50% 130%; transition: transform .2s; }
.carta-mao { position: relative; display: flex; width: clamp(84px, 21vw, 124px); aspect-ratio: 5/7; padding: 5px; border: 0; border-radius: 10px; text-align: center;
  background: linear-gradient(145deg, #9db2d6, #3b4f78 45%, #1f2b45); box-shadow: 0 0 0 2px #000, 0 8px 16px rgba(0,0,0,.55);
  transition: transform .22s cubic-bezier(.2,.8,.25,1.2), box-shadow .2s, filter .2s; animation: dar .42s cubic-bezier(.2,.8,.25,1.1) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes dar { from { transform: translate(140px, 60px) rotate(25deg) scale(.5); opacity: 0; } }
.carta-mao > span { flex: 1; display: grid; place-items: center; border-radius: 6px; padding: 14px 5px 6px; background: linear-gradient(#f4e7c6, #e3cd9c); color: var(--tinta); box-shadow: inset 0 0 0 2px rgba(60,35,15,.45);
  font: 600 clamp(11px, 2.8vw, 14px)/1.18 var(--f-texto); overflow: hidden; overflow-wrap: anywhere; hyphens: auto; }
.carta-mao i { position: absolute; left: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-pixel); font-style: normal; color: #fff; text-shadow: 0 1px 0 #000;
  background: radial-gradient(circle at 35% 30%, #a9d4ff, #2f6fc0 60%, #143563); box-shadow: 0 0 0 2px #000, 0 0 0 3px #c9a14a; }
@media (hover: hover) { .slot-mao:hover .carta-mao:not(:disabled) { transform: translateY(-10px); } }
.slot-mao.sel { z-index: 5; }
.slot-mao.sel .carta-mao { transform: translateY(-34%) scale(1.25); box-shadow: 0 0 0 2px #000, 0 0 0 4px #7ff0a0, 0 0 24px rgba(127,240,160,.7), 0 14px 26px rgba(0,0,0,.6); }
.carta-mao:disabled { cursor: default; }
.carta-mao.riscada { filter: grayscale(1) brightness(.55); }
.carta-mao.riscada > span { text-decoration: line-through; }
.carta-mao.certa { box-shadow: 0 0 0 2px #000, 0 0 0 4px #7ff0a0, 0 0 22px rgba(127,240,160,.8); }
.carta-mao.errada { box-shadow: 0 0 0 2px #000, 0 0 0 4px #ff6a4a, 0 0 22px rgba(255,90,60,.8); }

/* Efeitos: números, esfera de golpe, fagulhas, flash, toasts */
.flutua { position: fixed; z-index: 30; transform: translate(-50%, -50%); font: 700 30px var(--f-pixel); pointer-events: none; text-shadow: 0 3px 0 #000, 0 0 8px #000; animation: subir 1s ease-out forwards; white-space: nowrap; }
@keyframes subir { to { transform: translate(-50%, calc(-50% - 60px)); opacity: 0; } }
.orbe { position: fixed; left: 0; top: 0; z-index: 25; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: none; }
.orbe.bom { background: radial-gradient(circle, #fff, #ffe08a 35%, rgba(255,190,60,.0) 70%); box-shadow: 0 0 24px 10px rgba(255,210,100,.75); }
.orbe.mau { background: radial-gradient(circle, #fff, #ff8a6a 35%, rgba(255,70,40,0) 70%); box-shadow: 0 0 24px 10px rgba(255,80,50,.75); }
.fagulha { position: fixed; left: 0; top: 0; z-index: 26; width: 6px; height: 6px; pointer-events: none; }
.retrato.atingido { animation: atingido .4s linear; }
@keyframes atingido { 0% { filter: brightness(3); } 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); filter: brightness(1.6) saturate(.4); } 75% { transform: translateX(-3px); } 100% { filter: none; } }
.retrato.ataca { animation: ataca .35s ease-in-out; }
@keyframes ataca { 50% { transform: translateY(14px) scale(1.18); } }
.retrato.cai { animation: cai .6s ease-in forwards; }
@keyframes cai { 30% { transform: scale(1.2); filter: brightness(2.5); } 100% { transform: scale(0) rotate(30deg); opacity: 0; } }
.retrato.chega { animation: chega .5s cubic-bezier(.2,.8,.25,1.3) both; }
@keyframes chega { from { transform: translateY(-40px) scale(.3); opacity: 0; } }
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 24; background: radial-gradient(transparent 40%, rgba(200,40,20,.55)); animation: apagar .5s forwards; }
.flash.cura { background: radial-gradient(transparent 40%, rgba(80,190,100,.45)); }
@keyframes apagar { to { opacity: 0; } }
.tabuleiro.treme { animation: tremer .35s linear; }
@keyframes tremer { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(92vw, 460px); background: #1d140e; border: 2px solid var(--ouro); border-radius: 10px; padding: 10px 14px; font: 500 13px/1.35 var(--f-pixel); color: #fff3d6; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.faixa { position: fixed; left: 50%; top: 38%; z-index: 28; transform: translate(-50%, -50%); padding: 10px 28px; font: 800 clamp(20px, 6vw, 34px)/1 var(--f-titulo); color: #ffe7a0; text-shadow: 0 3px 0 #000; white-space: nowrap; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(60,20,10,.9) 15%, rgba(60,20,10,.9) 85%, transparent); animation: faixa 1.3s ease-out forwards; }
@keyframes faixa { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* Janelas (poderes, derrota) */
.veu { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; padding: 16px; background: rgba(5,3,6,.78); backdrop-filter: blur(3px); }
.janela-jogo { width: min(560px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(#2a1a12, #1a100b); border: 3px solid #000; box-shadow: 0 0 0 3px #a57b3a, 0 20px 50px rgba(0,0,0,.7); border-radius: 14px; padding: 18px; text-align: center; }

.aug { border: 3px solid #000; border-radius: 12px; padding: 12px 10px; background: linear-gradient(#3b2a52, #231834); box-shadow: inset 0 0 0 2px var(--epico); text-align: center; color: #f3e8ff; transition: transform .15s; animation: dar .4s cubic-bezier(.2,.8,.25,1.1) both; }

.lista-derrota { text-align: left; display: grid; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }

.lista-derrota li small { display: block; font: 500 10px var(--f-pixel); color: var(--nevoa); }

/* O que aparece em cada modo */
body:not(.batalha) .inimigo, body:not(.batalha) .barra-heroi, body:not(.batalha) .mao { display: none; }

}
function arrastavel(carta) {
  let x0 = 0, y0 = 0, dx = 0, dy = 0, ativo = false;
  carta.addEventListener('pointerdown', (e) => { if (!carta.classList.contains('virada') || e.target.closest('button')) return; ativo = true; x0 = e.clientX; y0 = e.clientY; carta.setPointerCapture(e.pointerId); carta.style.transition = 'none'; });
  carta.addEventListener('pointermove', (e) => { if (!ativo) return; dx = e.clientX - x0; dy = e.clientY - y0; carta.style.transform = `rotateY(180deg) translate(${-dx}px, ${dy}px) rotate(${-dx / 18}deg)`; });
  const fim = () => { if (!ativo) return; ativo = false; carta.style.transition = ''; carta.style.transform = '';
    if (dx > 90) avaliar('sabia'); else if (dx < -90) avaliar('errei'); else if (dy < -90) avaliar('hesitei'); dx = dy = 0; };
  carta.addEventListener('pointerup', fim); carta.addEventListener('pointercancel', fim);
}

// ---------- Modo Batalha ----------
// Cada andar tem um adversário com vida. Acertar causa dano nele (fácil 10, moderada 20, difícil 30);
// errar faz ele golpear você (fácil 2, moderada 5, difícil 10). Derrotou o adversário, sobe de andar e escolhe um poder.
const INIMIGOS = [
  { nome: 'Golem de Gesso', spr: 'golem', hp: 60 },
  { nome: 'Serpente do Ciático', spr: 'serpente', hp: 70 },
  { nome: 'Guardião do Acetábulo', spr: 'guardiao', hp: 110, chefe: true },
];
const PODERES = [
  { id: 'escudo', nome: 'Escudo', txt: 'Anula o próximo dano.', spr: 'escudo', usar: () => { E.escudo += 1; } },
  { id: 'imortal', nome: 'Imortal', txt: 'Uma vez, não morre: fica com 1 de vida.', spr: 'coroa', usar: () => { E.imortal = true; } },
  { id: 'pocao', nome: 'Poção do desafio', txt: '+20 de vida se acertar os próximos 3.', spr: 'pocao', usar: () => { E.pocao = 3; } },
  { id: 'pista', nome: 'Pergaminho da pista', txt: 'Elimina uma alternativa errada no próximo.', spr: 'pergaminho', usar: () => { E.pista += 1; } },
  { id: 'duplo', nome: 'Golpe duplo', txt: 'O próximo acerto causa o dobro de dano.', spr: 'espada', usar: () => { E.duplo = true; } },
];
const ATAQUE = { 1: 10, 2: 20, 3: 30 };

function hudBatalha() {
  const ret = $('#ret-inimigo'), I = E.inimigo;
  $('#nome-inimigo').innerHTML = I.nome + (I.chefe ? '<em>CHEFE</em>' : '');
  ret.classList.toggle('chefe', !!I.chefe);
  $('#hp-inim-barra').style.width = (100 * E.hpInim / E.hpInimMax) + '%'; $('#hp-inim').textContent = `${E.hpInim} / ${E.hpInimMax}`;
  $('#selo-andar').textContent = `Andar ${E.andar}`; $('#selo-pontos').textContent = `${E.pontos} pts`;
  $('#hp').textContent = E.hp; $('#gema-vida').classList.toggle('baixa', E.hp > 0 && E.hp <= 25);
  const ativos = [E.escudo && ['escudo', E.escudo], E.imortal && ['coroa', ''], E.pocao && ['pocao', E.pocao], E.pista && ['pergaminho', E.pista], E.duplo && ['espada', '']].filter(Boolean);
  const enc = $('#encaixes'); enc.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('div'); s.className = 'encaixe';
    if (ativos[i]) { s.classList.add('ativo'); s.appendChild(sprCanvas(ativos[i][0])); if (ativos[i][1] !== '') { const n = document.createElement('sup'); n.textContent = ativos[i][1]; s.appendChild(n); } s.title = ativos[i][0]; }
    enc.appendChild(s);
  }
  pilhas();
}
function novoInimigo() {
  const base = INIMIGOS[(E.andar - 1) % INIMIGOS.length];
  E.inimigo = base; E.hpInimMax = E.hpInim = base.hp + Math.floor((E.andar - 1) / 3) * 30;
  pixel($('#spr-inimigo'), SPR[base.spr], PAL);
  const ret = $('#ret-inimigo'); ret.classList.remove('cai'); animar(ret, 'chega');
  hudBatalha();
}
function iniciarBatalha() {
  E.geracao += 1;
  Object.assign(E, { hp: 100, andar: 1, pontos: 0, rodada: 0, seq: 0, escudo: 0, imortal: false, pocao: 0, pista: 0, duplo: false, derrubaram: [], fila: embaralhar(FLASHCARDS), descarte: 0 });
  pixel($('#spr-heroi'), SPR.heroi, PAL); pixel($('#coracao'), SPR.coracao, PAL);
  novoInimigo(); proximaBatalha();
}
function proximaBatalha() {
  if (!E.fila.length) E.fila = embaralhar(FLASHCARDS);
  let f = E.fila.shift();
  if (E.inimigo.chefe && f.dif < 3) { const dificil = E.fila.find((x) => x.dif === 3); if (dificil) { E.fila.push(f); f = dificil; E.fila.splice(E.fila.indexOf(dificil), 1); } }
  E.atual = f; E.respondida = false; E.sel = -1; palco.innerHTML = '';
  palco.appendChild(montarCarta(f, false, 'lancada')); animar($('#ret-inimigo'), 'ataca');
  dica.textContent = E.inimigo.chefe ? 'O chefe só joga flashcards difíceis.' : 'Toque numa alternativa para levantar; toque de novo para jogar.';
  // A mão: as alternativas, em leque
  const ordem = embaralhar(f.opcoes.map((t, i) => ({ t, i }))), n = ordem.length;
  mao.classList.remove('fora', 'recolhe'); mao.innerHTML = '';
  ordem.forEach((o, k) => {
    const d = k - (n - 1) / 2, slot = document.createElement('div'); slot.className = 'slot-mao';
    slot.style.setProperty('--r', `${d * 5}deg`); slot.style.setProperty('--y', `${Math.abs(d) ** 2 * 5}px`);
    slot.innerHTML = `<button class="carta-mao" style="--i:${k}" data-i="${o.i}" aria-label="Alternativa ${k + 1}: ${o.t}"><i>${k + 1}</i><span>${o.t}</span></button>`;
    mao.appendChild(slot);
  });
  if (E.pista) {
    const erradas = [...mao.querySelectorAll('.carta-mao')].filter((b) => +b.dataset.i !== f.certa);
    const r = erradas[Math.floor(Math.random() * erradas.length)]; r.classList.add('riscada'); r.disabled = true; E.pista -= 1;
  }
  mao.querySelectorAll('.carta-mao').forEach((b) => (b.onclick = () => escolher(b)));
  redondo.className = 'redondo'; redondo.textContent = 'Jogar'; redondo.disabled = true; redondo.onclick = () => { const b = mao.querySelector('.slot-mao.sel .carta-mao'); if (b) jogar(b); };
  hudBatalha();
}
function escolher(b) {
  if (E.respondida || b.disabled) return;
  const slot = b.parentElement;
  if (slot.classList.contains('sel')) return jogar(b);
  mao.querySelectorAll('.slot-mao.sel').forEach((s) => s.classList.remove('sel'));
  slot.classList.add('sel'); vibrar(8);
  redondo.disabled = false; redondo.classList.add('pronto');
}
function jogar(b) {
  if (E.respondida) return; E.respondida = true;
  const f = E.atual, i = +b.dataset.i, certo = i === f.certa;
  redondo.disabled = true; redondo.className = 'redondo';
  mao.querySelectorAll('.carta-mao').forEach((x) => { x.disabled = true; });
  // A alternativa voa da mão para a mesa
  if (!menosMov) {
    const [x0, y0] = centro(b), [x1, y1] = centro(palco);
    b.style.transition = 'transform .3s cubic-bezier(.5,0,.75,0), opacity .3s'; b.style.zIndex = 10;
    b.style.transform = `translate(${x1 - x0}px, ${y1 - y0}px) scale(.9) rotate(${certo ? 0 : -6}deg)`; b.style.opacity = '.0';
  }
  depois(300, () => {
    const carta = palco.querySelector('.carta'); carta.classList.remove('lancada'); carta.classList.add('virada');
    mao.querySelectorAll('.carta-mao').forEach((x) => { if (+x.dataset.i === f.certa) x.classList.add('certa'); else if (x === b) x.classList.add('errada'); });
    b.style.opacity = '1'; b.style.transform = '';
    if (certo) acerto(f); else erro(f);
  });
}
function acerto(f) {
  E.seq += 1; let dano = ATAQUE[f.dif]; if (E.duplo) { dano *= 2; E.duplo = false; }
  E.pontos += dano; vibrar(15);
  golpe(palco, $('#ret-inimigo'), true, () => {
    E.hpInim = Math.max(0, E.hpInim - dano); flutuar(`-${dano}`, '#ffd98a', $('#ret-inimigo'), 10); animar($('#ret-inimigo'), 'atingido');
    let cura = 0; if (E.seq % 3 === 0) cura += 5; if (f.raridade === 'lendaria') cura += 3;
    if (E.pocao) { E.pocao -= 1; if (!E.pocao) { cura += 20; toast('Poção do desafio: +20 de vida!'); } }
    if (cura) { E.hp = Math.min(100, E.hp + cura); depois(250, () => { flutuar(`+${cura}`, '#7fe08f', $('#ret-heroi'), -10); flash(true); }); }
    hudBatalha(); fimDaJogada(true);
  });
}
function erro(f) {
  E.seq = 0; if (E.pocao) { E.pocao = 0; toast('A poção se perdeu.'); }
  E.derrubaram.push(f);
  animar($('#ret-inimigo'), 'ataca');
  golpe($('#ret-inimigo'), $('#ret-heroi'), false, () => {
    if (E.escudo) { E.escudo -= 1; flutuar('Bloqueado', '#9cc6ff', $('#ret-heroi'), -10); }
    else {
      const dano = DIF[f.dif][1]; E.hp = Math.max(0, E.hp - dano); flutuar(`-${dano}`, '#ff7a5c', $('#ret-heroi'), -10); flash(false); vibrar([30, 50, 30]);
      animar($('#ret-heroi'), 'atingido'); animar(tabuleiro, 'treme');
      if (E.hp <= 0 && E.imortal) { E.hp = 1; E.imortal = false; depois(400, () => toast('Imortal: você resistiu com 1 de vida!')); }
    }
    hudBatalha(); fimDaJogada(false);
  });
}
function fimDaJogada(certo) {
  E.rodada += 1; E.descarte += 1;
  const venceu = E.hpInim <= 0, caiu = E.hp <= 0;
  dica.textContent = caiu ? 'Você caiu.' : venceu ? `${E.inimigo.nome} derrotado!` : certo ? 'Acertou! Leia o verso e siga.' : 'Leia a resposta no verso e siga.';
  if (venceu) { const ret = $('#ret-inimigo'); fagulhas(...centro(ret), ['#e3b04b', '#fff3c0', '#b48cf0'], 22); if (!menosMov) ret.classList.add('cai'); faixa('Vitória!'); }
  depois(650, () => {
    mao.classList.add('recolhe'); depois(320, () => mao.classList.add('fora'));
    redondo.disabled = false; redondo.className = 'redondo seguir'; redondo.textContent = caiu ? 'Fim' : venceu ? 'Poder' : 'Seguir';
    redondo.onclick = seguir; redondo.focus({ preventScroll: true });
  });
}
function seguir() {
  if (!E.respondida || redondo.disabled) return;
  redondo.disabled = true;
  if (E.hp <= 0) return derrota();
  if (E.hpInim <= 0) return escolherPoder();
  proximaBatalha();
}
function escolherPoder() {
  const tres = embaralhar(PODERES).slice(0, 3);
  const prox = INIMIGOS[E.andar % INIMIGOS.length];
  const veu = document.createElement('div'); veu.className = 'veu';
  veu.innerHTML = `<div class="janela-jogo" role="dialog" aria-modal="true" aria-labelledby="t-poder"><h2 id="t-poder">${E.inimigo.nome} caiu</h2>
    <p>Andar ${E.andar + 1}: ${prox.chefe ? 'o <b>chefe</b> espera, e só joga flashcards difíceis' : `vem aí ${prox.nome}`}. Escolha um poder para levar.</p>
    <div class="escolhas">${tres.map((p) => `<button class="aug" data-id="${p.id}"><span class="spr" data-spr="${p.spr}"></span><b>${p.nome}</b><span>${p.txt}</span></button>`).join('')}</div></div>`;
  document.body.appendChild(veu);
  veu.querySelectorAll('.spr').forEach((s) => s.replaceWith(sprCanvas(s.dataset.spr)));
  veu.querySelectorAll('.aug').forEach((b) => (b.onclick = () => {
    PODERES.find((p) => p.id === b.dataset.id).usar(); veu.remove(); toast(`${b.querySelector('b').textContent} ativado.`);
    E.andar += 1; novoInimigo(); if (E.inimigo.chefe) faixa('Chefe!'); proximaBatalha();
  }));
  veu.querySelector('.aug').focus();
}
function derrota() {
  const unicos = [...new Map(E.derrubaram.map((f) => [f.id, f])).values()];
  const veu = document.createElement('div'); veu.className = 'veu';
  veu.innerHTML = `<div class="janela-jogo" role="dialog" aria-modal="true" aria-labelledby="t-fim"><h2 id="t-fim">Você caiu no andar ${E.andar}</h2>
    <p>${E.pontos} pontos em ${E.rodada} flashcards. Estes te derrubaram e entram na sua fila de revisão de flashcards:</p>
    <ul class="lista-derrota">${unicos.map((f) => `<li>${f.resposta}<small>${f.assunto} · ${f.id}</small></li>`).join('')}</ul>
    <button class="btn b-sabia btn-largo" id="b-nova">Nova partida</button></div>`;
  document.body.appendChild(veu);
  $('#b-nova').onclick = () => { veu.remove(); iniciarBatalha(); }; $('#b-nova').focus();
}

// ---------- Trocas de modo e cenário ----------
function modo(m) {
  E.modo = m; E.geracao += 1; document.body.classList.toggle('batalha', m === 'batalha');
  $('#aba-estudo').setAttribute('aria-pressed', m === 'estudo'); $('#aba-batalha').setAttribute('aria-pressed', m === 'batalha');
  document.querySelectorAll('.veu, .faixa, .orbe, .flutua').forEach((v) => v.remove());
  if (m === 'batalha') { if (cenario === 'velas') trocarCenario('masmorra'); iniciarBatalha(); }
  else { E.fila = embaralhar(FLASHCARDS); E.descarte = 0; mao.innerHTML = ''; proximaEstudo(); }
}
function trocarCenario(c) { cenario = c; document.body.dataset.cena = c; ['velas', 'campo', 'masmorra'].forEach((k) => $('#c-' + k).setAttribute('aria-pressed', k === c)); desenharCena(); salvar(); }
$('#aba-estudo').onclick = () => modo('estudo');
$('#aba-batalha').onclick = () => modo('batalha');
$('#c-velas').onclick = () => trocarCenario('velas');
$('#c-campo').onclick = () => trocarCenario('campo');
$('#c-masmorra').onclick = () => trocarCenario('masmorra');
$('#c-assinante').onclick = () => { E.assinante = !E.assinante; $('#c-assinante').setAttribute('aria-pressed', E.assinante); if (E.modo === 'estudo') { hudEstudo(); if (palco.querySelector('.lacrada')) proximaEstudo(); } };
addEventListener('keydown', (e) => {
  if (document.querySelector('.veu')) return;
  if (E.modo === 'estudo') {
    if (e.code === 'Space' || e.key === 'Enter') { if (document.activeElement?.tagName === 'BUTTON' && e.key === 'Enter') return; e.preventDefault(); virar(); }
    if (palco.querySelector('.virada')) { if (e.key === '1') avaliar('errei'); if (e.key === '2') avaliar('hesitei'); if (e.key === '3') avaliar('sabia'); }
  } else if (!E.respondida && /^[1-4]$/.test(e.key)) { const b = mao.querySelectorAll('.carta-mao')[+e.key - 1]; if (b && !b.disabled) jogar(b); }
  else if (E.respondida && (e.key === 'Enter' || e.code === 'Space') && document.activeElement !== redondo) { e.preventDefault(); seguir(); }
});

trocarCenario(cenario);
E.fila = embaralhar(FLASHCARDS); proximaEstudo();
</script>
