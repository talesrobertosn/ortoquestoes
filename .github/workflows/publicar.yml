name: Publicar no GitHub Pages

on:
  push:
    # O repositório ainda não tem branch principal: enquanto não tiver, a
    # publicação sai da branch de trabalho. Ao criar a main, ela assume.
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testar o detector de figura ausente
        run: python3 fixtures/testar_deteccao.py
      - name: Validar o acervo
        run: python3 scripts/validar_acervo.py
      - name: Construir
        run: npm run build
        env:
          # Trocar para "/" ao migrar para o domínio próprio.
          BASE_ORTOQUESTOES: /ortoquestoes/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
