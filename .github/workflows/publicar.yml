name: Publicar no GitHub Pages

on:
  push:
    # O repositório ainda não tem branch principal: enquanto não tiver, a
    # publicação sai da branch de trabalho. Ao criar a main, ela assume.
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testar revisão e backup
        run: node fixtures/testar_revisao.mjs
      - name: Testar o detector de figura ausente
        run: python3 fixtures/testar_deteccao.py
      - name: Validar o acervo
        run: python3 scripts/validar_acervo.py
      - name: Construir
        # Sem BASE_ORTOQUESTOES: o vite.config.ts usa caminho relativo, e o
        # mesmo build serve tanto usuario.github.io/ortoquestoes/ quanto
        # ortoquestoes.com.br/ — não é preciso reconstruir ao trocar o endereço.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
