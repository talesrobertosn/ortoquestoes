name: Publicar no GitHub Pages

on:
  push:
    # O repositório ainda não tem branch principal: enquanto não tiver, a
    # publicação sai da branch do site. Ao criar a main, ela assume. As outras
    # branches de trabalho chegam ao site por pull request (não publicam
    # sozinhas, o que só gerava falhas e e-mails de erro).
    branches: [main, master, "claude/pdfs-questoes-tp64dr"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Executar testes de domínio
        run: npm test
      - name: Testar revisão e backup
        run: node fixtures/testar_revisao.mjs
      - name: Testar reinício do progresso
        run: node fixtures/testar_reinicio.mjs
      - name: Testar o detector de figura ausente
        run: python3 fixtures/testar_deteccao.py
      - name: Validar o acervo
        run: python3 scripts/validar_acervo.py
      - name: Atualizar os temas que mais caem e o resumão
        # Recontagem das provas oficiais a cada publicação: o ranking, o
        # cronograma e o resumão da reta final nunca ficam para trás quando o acervo muda.
        run: python3 scripts/gerar_incidencia.py && python3 scripts/gerar_resumao.py
      - name: Atualizar as letras das alternativas
        # Quais questões embaralham na revisão e onde o comentário cita a alternativa pela
        # letra (scripts/letras_alternativas.py): sempre de acordo com os comentários publicados.
        run: python3 scripts/letras_alternativas.py
      - name: Gerar páginas públicas e sitemap
        # Uma página estática por questão e por assunto, os guias, as páginas de
        # destino (banco de questões, TEOT, curso preparatório, provas, R1, simulados,
        # flashcards, sobre), os resumos da Biblioteca (/resumos/, leitura aberta) e
        # o llms.txt, para o Google e os assistentes de IA. São geradas do acervo
        # a cada deploy e não ficam no repositório (docs/seo/PLANO-SEO-R1-2027.md).
        run: python3 scripts/gerar_paginas_seo.py && python3 scripts/gerar_guias_seo.py && python3 scripts/gerar_paginas_destino.py && python3 scripts/gerar_resumos_seo.py && python3 scripts/gerar_sitemap.py
      - name: Construir
        # Sem BASE_ORTOQUESTOES: o vite.config.ts usa caminho relativo, e o
        # mesmo build serve tanto usuario.github.io/ortoquestoes/ quanto
        # ortoquestoes.com.br/ — não é preciso reconstruir ao trocar o endereço.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_LIMITES_HABILITADOS: ${{ vars.VITE_LIMITES_HABILITADOS }}
          VITE_PAGAMENTOS_HABILITADOS: ${{ vars.VITE_PAGAMENTOS_HABILITADOS }}
          # Flashcards, beta público (diretriz de 13/10/2026; parte 18 do SQL aplicada pelo Tales):
          # limite grátis de 10 por 24 h e progresso na conta (com VITE_LIMITES_HABILITADOS),
          # ranking da Cripta por dificuldade, menu, capa e página de planos.
          VITE_FLASHCARDS: '1'
          VITE_FLASHCARDS_LIMITE: 'true'
          VITE_FLASHCARDS_RANKING: '1'
          VITE_FLASHCARDS_CAPA: '1'
          VITE_FLASHCARDS_VENDA: '1'
          # Pixel do Meta (anúncios). Vazio: usa o do código (src/conta/consentimento.ts).
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
