name: Publicar no GitHub Pages

on:
  push:
    # O repositório ainda não tem branch principal: enquanto não tiver, a
    # publicação sai da branch do site. Ao criar a main, ela assume. As outras
    # branches de trabalho chegam ao site por pull request (não publicam
    # sozinhas, o que só gerava falhas e e-mails de erro).
    branches: [main, master, "claude/pdfs-questoes-tp64dr"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  impacto:
    runs-on: ubuntu-latest
    outputs:
      executar: ${{ steps.impacto.outputs.executar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identificar impacto
        id: impacto
        env:
          BASE: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = workflow_dispatch ]; then
            echo 'executar=true' >> "$GITHUB_OUTPUT"
          else
            executar=$(python3 scripts/ci/impacto.py "$BASE" HEAD)
            echo "executar=$executar" >> "$GITHUB_OUTPUT"
          fi

  construir:
    needs: impacto
    if: needs.impacto.outputs.executar == 'true'
    # Deduplicar o mesmo commit sem permitir que um rerun antigo cancele
    # a construção de um SHA mais recente. Deploy tem fila própria.
    concurrency:
      group: pages-build-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Executar testes de domínio
        run: npm test
      - name: Validar o acervo
        run: python3 scripts/validar_acervo.py
      - name: Atualizar os temas que mais caem e o resumão
        # Recontagem das provas oficiais a cada publicação: o ranking, o
        # cronograma e o resumão da reta final nunca ficam para trás quando o acervo muda.
        run: python3 scripts/gerar_incidencia.py && python3 scripts/gerar_resumao.py
      - name: Atualizar as letras das alternativas
        # Quais questões embaralham na revisão e onde o comentário cita a alternativa pela
        # letra (scripts/letras_alternativas.py): sempre de acordo com os comentários publicados.
        run: python3 scripts/letras_alternativas.py
      - name: Gerar páginas públicas e sitemap
        # Uma página estática por questão e por assunto, os guias, as páginas de
        # destino (banco de questões, TEOT, curso preparatório, provas, R1, simulados,
        # flashcards, sobre), os resumos da Biblioteca (/resumos/, leitura aberta) e
        # o llms.txt, para o Google e os assistentes de IA. São geradas do acervo
        # a cada deploy e não ficam no repositório (docs/seo/PLANO-SEO-R1-2027.md).
        run: python3 scripts/gerar_paginas_seo.py && python3 scripts/gerar_guias_seo.py && python3 scripts/gerar_paginas_destino.py && python3 scripts/gerar_provas_anteriores.py && python3 scripts/gerar_resumos_seo.py && python3 scripts/gerar_sitemap.py
      - name: Construir
        # Sem BASE_ORTOQUESTOES: o vite.config.ts usa caminho relativo, e o
        # mesmo build serve tanto usuario.github.io/ortoquestoes/ quanto
        # ortoquestoes.com.br/ — não é preciso reconstruir ao trocar o endereço.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_LIMITES_HABILITADOS: ${{ vars.VITE_LIMITES_HABILITADOS }}
          VITE_PAGAMENTOS_HABILITADOS: ${{ vars.VITE_PAGAMENTOS_HABILITADOS }}
          # Flashcards, beta público (diretriz de 13/10/2026; parte 18 do SQL aplicada pelo Tales):
          # limite grátis de 10 por 24 h e progresso na conta (com VITE_LIMITES_HABILITADOS),
          # ranking da Cripta por dificuldade, menu, capa e página de planos.
          VITE_FLASHCARDS: '1'
          VITE_FLASHCARDS_LIMITE: 'true'
          VITE_FLASHCARDS_RANKING: '1'
          VITE_FLASHCARDS_CAPA: '1'
          VITE_FLASHCARDS_VENDA: '1'
          # Pixel do Meta (anúncios). Vazio: usa o do código (src/conta/consentimento.ts).
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    # Não interromper uma publicação em andamento. O guard abaixo também
    # impede que uma execução antiga/reexecutada sobrescreva a versão atual.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Conferir versão antes de publicar
        id: atual
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main|master|claude/pdfs-questoes-tp64dr) ;;
            *) echo 'Publicação manual só nas branches de publicação.' >&2; exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin "$BRANCH"
          # Documentação posterior não invalida um build do aplicativo.
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ] || [ "$(python3 scripts/ci/impacto.py HEAD FETCH_HEAD)" = false ]; then
            echo 'publicar=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Build superado por alterações funcionais; aguardando a versão mais recente.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: publicacao
        if: steps.atual.outputs.publicar == 'true'
        uses: actions/deploy-pages@v4
