name: Verificar Pull Request

on:
  pull_request:
    # Só dispara quando muda algo que entra no site ou nos testes (diretriz de 20/10/2026:
    # economizar minutos do Actions). docs/, marketing/, protótipos, relatórios, pdfs e os .md
    # da raiz não entram no build; as duas exceções de docs/ são lidas pelos testes
    # (fixtures/testar_paywall.py e scripts/comentarios-resumos/catalogo.py).
    paths:
      - "**"
      - "!docs/**"
      - "!marketing/**"
      - "!prototipos/**"
      - "!relatorios/**"
      - "!pdfs/**"
      - "!.claude/**"
      - "!*.md"
      - "docs/ativacao-e-rollback-assinaturas.md"
      - "docs/comentarios-resumos/**"

permissions:
  contents: read

# Um push novo no mesmo PR cancela a verificação antiga, que já não vale para o código atual.
concurrency:
  group: verificar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validar
      - run: npm run build
      - run: git diff --check
