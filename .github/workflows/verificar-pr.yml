name: Verificar Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identificar impacto
        id: impacto
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          executar=$(python3 scripts/ci/impacto.py "$BASE" HEAD)
          echo "executar=$executar" >> "$GITHUB_OUTPUT"
      # O job continua existindo para não deixar checks obrigatórios pendentes
      # em PRs documentais. Entradas desconhecidas exigem a suíte completa.
      - uses: actions/setup-node@v4
        if: steps.impacto.outputs.executar == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.impacto.outputs.executar == 'true'
      - run: npm test
        if: steps.impacto.outputs.executar == 'true'
      - run: npm run validar
        if: steps.impacto.outputs.executar == 'true'
      # build já executa tsc -b com o mesmo tsconfig; evita um segundo typecheck.
      - run: npm run build
        if: steps.impacto.outputs.executar == 'true'
      - run: git diff --check
      - name: Resumir execução
        env:
          EXECUTAR: ${{ steps.impacto.outputs.executar }}
        run: |
          echo "Suíte e build necessários: $EXECUTAR (documentação pura dispensa Node)." >> "$GITHUB_STEP_SUMMARY"
